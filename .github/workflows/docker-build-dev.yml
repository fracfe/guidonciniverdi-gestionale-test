name: Build Docker Image

on:
  push:
    branches: [ "dev" ]

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-gestionale:
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Build Gestionale Image
      run: |
        docker build . \
          --file gestionale/Dockerfile \
          --tag ghcr.io/egit-guidoncini-verdi/guidonciniverdi-gestionale:dev

  build-daemon:
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Build Gestionale Daemon Image
      run: |
        docker build . \
          --file gestionale-daemon/Dockerfile \
          --tag ghcr.io/egit-guidoncini-verdi/guidonciniverdi-gestionale-daemon:dev
